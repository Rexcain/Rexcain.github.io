  <!-- 分享预览（Open Graph / Twitter） -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://rexcain.github.io/visual-art.html" />
  <meta property="og:title" content="Visual Arts — Menghan Rex Jiang" />

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- 导航栏 -->
  <header id="navbar">
    <a class="nav-name" href="index.html">Menghan Rex Jiang</a>
    <nav class="nav-links" aria-label="Main">
      <a href="performance.html">Performance</a>
      <a href="visual-art.html" aria-current="page">Visual Arts</a>
      <a href="bio.html">Bio</a>
    </nav>
  </header>

  <main id="main">

    <!-- 数字艺术区块 -->
    <section id="art" class="section" aria-labelledby="art-title">
      <h1 id="art-title" class="section-title">Visual Arts</h1>

      <div class="grid">

        <div class="card art-card">
          <div class="card-thumb art-thumb">
            <img src="https://i.ibb.co/dJG00wfd/Abstract-final.jpg"
                 alt="Lava Sun" loading="lazy" />
            <div class="art-overlay" aria-hidden="true">
              <span>View</span>
            </div>
          </div>
          <div class="card-info">
            <h3>Lava Sun</h3>
            <p>2025</p>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer>
    <p>© <span id="year">2026</span> Menghan Rex Jiang All Rights Reserved</p>
  </footer>

  <!-- 图片灯箱 Modal -->
  <div id="img-modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Artwork viewer">
    <div class="modal-backdrop"></div>
    <div class="modal-body img-modal-body">
      <button class="modal-close" type="button" aria-label="Close">✕</button>
      <img id="modal-img" alt="" />
    </div>
  </div>

  <script src="script.js"></script>
