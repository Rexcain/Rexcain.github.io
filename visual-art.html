<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visual Arts</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- 导航栏 -->
  <nav id="navbar">
    <span class="nav-name">
      <a href="index.html">Menghan Rex Jiang</a>
    </span>
    <div class="nav-links">
      <a href="performance.html">Performance</a>
      <a href="visual-art.html">Visual Arts</a>
      <a href="bio.html">Bio</a>
    </div>
  </nav>

  <!-- 数字艺术区块 -->
  <section id="art" class="section">
    <h2 class="section-title">Visual Arts</h2>

    <div class="grid">

      <div class="card art-card">
        <div class="card-thumb art-thumb">
          <img src="https://i.ibb.co/dJG00wfd/Abstract-final.jpg" 
               alt="Lava Sun" />
          <div class="art-overlay">
            <span>View</span>
          </div>
        </div>
        <div class="card-info">
          <h3>Lava Sun</h3>
          <p>2025</p>
        </div>
      </div>

    </div>
  </section>

  <!-- 图片灯箱 Modal -->
  <div id="img-modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-body img-modal-body">
      <button class="modal-close">✕</button>
      <img id="modal-img" src="" alt="" />
    </div>
  </div>
  
  <script src="script.js"></script>
