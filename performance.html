<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Performance</title>
  <link rel="stylesheet" href="style.css" />
</head> 
 
<body>
  <!-- 导航栏 -->
  <nav id="navbar">
    <span class="nav-name">
      <a href="index.html">Menghan Rex Jiang</a>
    </span>
    <div class="nav-links">
      <a href="performance.html">Performance</a>
      <a href="visual-art.html">Visual Arts</a>
      <a href="bio.html">Bio</a>
    </div>
  </nav>
  
 <!-- 音乐区块 -->
  <section id="music" class="section">
    <h2 class="section-title">Performance</h2>

    <div class="grid">

      <div class="card" data-video="https://www.youtube.com/embed/Tj3Dg86KTW0">
        <div class="card-thumb">
          <img src="https://img.youtube.com/vi/Tj3Dg86KTW0/hqdefault.jpg"
               alt="Improv Trio" />
          <div class="play-btn">▶</div>
        </div>
        <div class="card-info">
          <h3>Improv Trio</h3>
          <p>2025 @ Peabody, Baltimore MD</p>
          <p>with André DeGrenier on drum set and Rodrigo Valente Pascale on guitar</p>
        </div>
      </div>

      <div class="card" data-video="https://www.youtube.com/embed/hUupn0Mu3VU">
        <div class="card-thumb">
          <img src="https://img.youtube.com/vi/hUupn0Mu3VU/hqdefault.jpg"
               alt="Improv Duo" />
          <div class="play-btn">▶</div>
        </div>
        <div class="card-info">
          <h3>Improv Duo</h3>
          <p>2026 @ Wax Atlas, Baltimore MD</p>
          <p>with Yizhen Zoe Lyu</p>
        </div>
      </div>
      
      <div class="card" data-video="https://www.youtube.com/embed/il5_Id59L6U">
        <div class="card-thumb">
          <img src="https://img.youtube.com/vi/il5_Id59L6U/hqdefault.jpg"
               alt="Water Monster" />
          <div class="play-btn">▶</div>
        </div>
        <div class="card-info">
          <h3>Water Monster</h3>
          <p>2026 @ The Warehouse, Hanover, NH</p>
        </div>
      </div>

    </div>
  </section>

  <!-- 视频灯箱 Modal -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-body">
      <button class="modal-close">✕</button>
      <div class="video-wrapper">
        <iframe id="modal-iframe"
          src=""
          frameborder="0"
          allow="autoplay; encrypted-media"
          allowfullscreen>
        </iframe>
      </div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
